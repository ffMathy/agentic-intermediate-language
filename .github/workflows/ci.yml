name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun link
      - run: bun install --frozen-lockfile
        working-directory: examples/tictactoe
      - run: bunx playwright install --with-deps chromium   # for the screenshot test
      - run: bun run typecheck
      - run: bun test

  kata:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # screenshots go to the ail-shots branch
      pull-requests: write   # one review comment per project
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          project: examples/tictactoe

  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # screenshots go to the ail-shots branch
      pull-requests: write   # one review comment per project
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          project: site
