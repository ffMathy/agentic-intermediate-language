name: AIL
description: 'Run `ail build` on an AIL project (with nothing to compile it only checks that the spec is sound, the code is built from it, and every check passes), and review the spec changes in the job summary and, on pull requests, in a comment with screenshots.'
inputs:
  project:
    description: 'Directory containing ail.config.json'
    default: "."
  base:
    description: 'Git ref to describe spec changes against (default origin/main when it exists; empty string to skip)'
    default: "origin/main"
  screenshots:
    description: 'On pull requests, screenshot the final screen of every scenario of changed nodes with a look, and of the nodes that use them'
    default: "true"
  comment:
    description: 'On pull requests, keep one comment per project up to date with the spec review and its screenshots. Needs `pull-requests: write`, and `contents: write` for screenshots (they are pushed to the `ail-shots` branch).'
    default: "true"
  token:
    description: 'Token used to push screenshots and comment'
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - name: Install ail
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile && bun link
    - name: Install project
      shell: bash
      working-directory: ${{ inputs.project }}
      run: if [ -f package.json ]; then bun install --frozen-lockfile; fi
    - name: ail build
      shell: bash
      working-directory: ${{ inputs.project }}
      run: bun "${{ github.action_path }}/src/cli.ts" build
    - name: Install Chromium for screenshots
      if: ${{ always() && inputs.base != '' && inputs.screenshots == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bunx playwright install --with-deps chromium
    - name: Spec changes
      if: ${{ always() && inputs.base != '' }}
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        AIL_BASE: ${{ inputs.base }}
        AIL_PROJECT: ${{ inputs.project }}
        AIL_SHOTS: ${{ inputs.screenshots == 'true' && github.event_name == 'pull_request' }}
        AIL_COMMENT: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
        AIL_PR: ${{ github.event.pull_request.number }}
        AIL_SHA: ${{ github.event.pull_request.head.sha }}
        AIL_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/scripts/review.sh" "${{ github.action_path }}/src/cli.ts"
