name: AIL
description: 'Run `ail build` on an AIL project (with nothing to compile it only checks that the spec is sound, the code is built from it, and every check passes), and review the spec changes in the job summary and, on pull requests, in a comment with screenshots, with every check (test by test, with its screens) in the description.'
inputs:
  project:
    description: 'Directory containing ail.config.json'
    default: "."
  base:
    description: 'Git ref to describe spec changes against (default origin/main when it exists; empty string to skip)'
    default: "origin/main"
  screenshots:
    description: 'On pull requests, screenshot the final screen of every scenario of changed nodes with a look, and of the nodes that use them'
    default: "true"
  comment:
    description: 'On pull requests, keep one comment per project up to date with the spec review and its screenshots. Needs `pull-requests: write`, and `contents: write` for screenshots (they are pushed to the `ail-shots` branch).'
    default: "true"
  affected:
    description: 'On pull requests, run and show only the checks of the nodes the change affects (changed since `base`, and every node that uses them). The spec and whether the code is built from it are still checked in full; pushes check everything.'
    default: "true"
  description:
    description: 'On pull requests, keep one section per project in the description with every check of the build: each test with a check mark or a cross, and under it the screen it ended on. Needs `pull-requests: write`, and `contents: write` for screenshots.'
    default: "true"
  token:
    description: 'Token used to push screenshots and comment'
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - name: Install ail
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile && bun link
    - name: Install project
      shell: bash
      working-directory: ${{ inputs.project }}
      run: if [ -f package.json ]; then bun install --frozen-lockfile; fi
    - name: Install Chromium (end-to-end checks, screenshots)
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        AIL_PROJECT_DIR: ${{ github.workspace }}/${{ inputs.project }}
        AIL_SHOTS: ${{ inputs.base != '' && inputs.screenshots == 'true' && github.event_name == 'pull_request' }}
      run: |
        if [ -d "$AIL_PROJECT_DIR/checks/e2e" ] || [ "$AIL_SHOTS" = "true" ]; then
          bunx playwright install --with-deps chromium
        fi
    - name: ail build
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        AIL_PROJECT: ${{ inputs.project }}
        AIL_BASE: ${{ inputs.base }}
        AIL_PR_RUN: ${{ inputs.affected == 'true' && inputs.base != '' && github.event_name == 'pull_request' }}
      run: |
        # Every check's results, for the review step (scripts/review.sh names the file the same way).
        slug=$(echo "$AIL_PROJECT" | tr -c 'A-Za-z0-9_-' '-' | sed 's/^-*//; s/-*$//')
        # On pull requests, only the checks of what the change affects; on pushes, every check.
        since=()
        if [ "$AIL_PR_RUN" = "true" ] && git rev-parse --verify --quiet "$AIL_BASE" >/dev/null; then since=(--since "$AIL_BASE"); fi
        bun "${{ github.action_path }}/src/cli.ts" build --report "$RUNNER_TEMP/ail-report-${slug:-root}.json" "${since[@]}"
    - name: Spec changes
      if: ${{ always() && inputs.base != '' }}
      shell: bash
      working-directory: ${{ inputs.project }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        AIL_BASE: ${{ inputs.base }}
        AIL_PROJECT: ${{ inputs.project }}
        AIL_SHOTS: ${{ inputs.screenshots == 'true' && github.event_name == 'pull_request' }}
        AIL_COMMENT: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
        AIL_DESCRIPTION: ${{ inputs.description == 'true' && github.event_name == 'pull_request' }}
        AIL_PR: ${{ github.event.pull_request.number }}
        AIL_SHA: ${{ github.event.pull_request.head.sha }}
        AIL_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/scripts/review.sh" "${{ github.action_path }}/src/cli.ts"
