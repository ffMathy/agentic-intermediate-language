name: AIL check
description: Run `ail check` on an AIL project (spec sound, code built from it, every check passing) and put a review of the spec changes in the job summary.
inputs:
  project:
    description: Directory containing ail.config.json
    default: "."
  base:
    description: Git ref to describe spec changes against in the job summary (default origin/main when it exists; empty string to skip)
    default: "origin/main"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - name: Install ail
      shell: bash
      working-directory: ${{ github.action_path }}
      run: bun install --frozen-lockfile && bun link
    - name: Install project
      shell: bash
      working-directory: ${{ inputs.project }}
      run: if [ -f package.json ]; then bun install --frozen-lockfile; fi
    - name: ail check
      shell: bash
      working-directory: ${{ inputs.project }}
      run: bun "${{ github.action_path }}/src/cli.ts" check
    - name: Spec changes
      if: ${{ always() && inputs.base != '' }}
      shell: bash
      working-directory: ${{ inputs.project }}
      run: |
        if git rev-parse --verify --quiet "${{ inputs.base }}" >/dev/null; then
          bun "${{ github.action_path }}/src/cli.ts" show changes --since "${{ inputs.base }}" >> "$GITHUB_STEP_SUMMARY"
        fi
