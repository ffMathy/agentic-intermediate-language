name: AIL check
description: Lint an AIL spec, fail if generated code is stale or hand-edited, run every check the IL implies, and post the IL review to the job summary.
inputs:
  project:
    description: Directory containing ail.config.json
    default: "."
  base:
    description: Git ref to diff the IL against for the review summary (empty to skip)
    default: ""
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
    - name: Install toolchain
      shell: bash
      run: bun install --cwd "${{ github.action_path }}" --frozen-lockfile
    - name: Install project
      shell: bash
      working-directory: ${{ inputs.project }}
      run: if [ -f package.json ]; then bun install --frozen-lockfile; fi
    - name: ail lint
      shell: bash
      working-directory: ${{ inputs.project }}
      run: bun "${{ github.action_path }}/src/cli.ts" lint
    - name: ail plan --check
      shell: bash
      working-directory: ${{ inputs.project }}
      run: bun "${{ github.action_path }}/src/cli.ts" plan --check
    - name: ail verify
      shell: bash
      working-directory: ${{ inputs.project }}
      run: bun "${{ github.action_path }}/src/cli.ts" verify
    - name: IL review summary
      if: ${{ inputs.base != '' }}
      shell: bash
      working-directory: ${{ inputs.project }}
      run: bun "${{ github.action_path }}/src/cli.ts" review --base "${{ inputs.base }}" >> "$GITHUB_STEP_SUMMARY"
