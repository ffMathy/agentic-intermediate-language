<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@500;600;700&family=Inconsolata:wght@500;600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #fffaf0; font-family: Inter, sans-serif; color: #2a1a0e; }
  .card { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px; display: grid; grid-template-columns: 1fr 420px; gap: 48px; align-items: center; }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 10px; background: linear-gradient(90deg, #4d7c0f 0 25%, #ca8a04 25% 50%, #c2410c 50% 75%, #9f1239 75% 100%); }
  .brand { display: flex; align-items: center; gap: 20px; }
  .wordmark { font-family: Fraunces, Georgia, serif; font-weight: 800; font-size: 120px; line-height: 0.9; letter-spacing: -0.02em; }
  .said { margin-top: 18px; font-size: 22px; font-weight: 600; color: #92400e; }
  h1 { margin: 34px 0 0; font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 46px; line-height: 1.12; letter-spacing: -0.01em; }
  h1 em { font-style: normal; background: linear-gradient(transparent 58%, #fde68a 58%); }
  .url { margin-top: 30px; font-family: Inconsolata, monospace; font-size: 22px; font-weight: 600; color: #6b5340; }
</style>
</head>
<body>
<div class="card">
  <div>
    <div class="brand">
      <svg width="78" height="100" viewBox="0 0 22 28" aria-hidden="true"><path d="M3 4 H19 L17.5 26 H4.5 Z" fill="#ca8a04" stroke="#2a1a0e" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 4 H19 L18.6 10 H3.4 Z" fill="#fffaf0" stroke="#2a1a0e" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <div class="wordmark">AIL</div>
    </div>
    <div class="said">Agentic Intermediate Language · said like the ale</div>
    <h1>Write the spec. Let agents build the code. <em>Prove that they agree.</em></h1>
    <div class="url">github.com/ffMathy/agentic-intermediate-language</div>
  </div>
  <svg viewBox="0 0 320 470" width="420" height="617" style="height: 520px; width: auto; justify-self: center" aria-hidden="true">
    <rect x="20" y="10" width="280" height="72" rx="12" fill="#fffdf8" stroke="#e3cfa9" stroke-width="1.5"/>
    <path d="M44 80 L40 94 L68 80 Z" fill="#fffdf8"/>
    <path d="M44 82 L40 94 L68 82" fill="none" stroke="#e3cfa9" stroke-width="1.5"/>
    <text x="160" y="34" text-anchor="middle" font-family="Inter" font-size="13" font-weight="600" fill="#6b5340">Tic-Tac-Toe.</text>
    <text x="160" y="62" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="700" fill="#2a1a0e">The computer never loses.</text>
    <rect x="40" y="104" width="240" height="52" rx="8" fill="#4d7c0f"/>
    <rect x="40" y="162" width="240" height="52" rx="8" fill="#ca8a04"/>
    <rect x="40" y="220" width="240" height="52" rx="8" fill="#c2410c"/>
    <rect x="40" y="278" width="240" height="52" rx="8" fill="#9f1239"/>
    <g font-family="Inter" font-size="14" font-weight="700" fill="#ffffff">
      <text x="54" y="135">Product</text><text x="54" y="193">Experience</text><text x="54" y="251">System</text><text x="54" y="309">Specialist</text>
    </g>
    <g font-family="Inter" font-size="11" fill="#ffffff" opacity="0.85" text-anchor="end">
      <text x="268" y="135">anyone</text><text x="268" y="193">design · QA</text><text x="268" y="251">engineers</text><text x="268" y="309">experts</text>
    </g>
    <rect x="40" y="338" width="240" height="64" rx="8" fill="#1b120a"/>
    <g font-family="Inconsolata, monospace" font-size="12" fill="#f6ead6">
      <text x="54" y="362">export function choose(</text><text x="66" y="378">board: Board, me: Mark = "O"</text><text x="54" y="394">): number {</text>
    </g>
    <line x1="160" y1="82" x2="160" y2="336" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <line x1="160" y1="404" x2="160" y2="414" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
    <rect x="132" y="414" width="56" height="26" rx="13" fill="#15803d"/>
    <text x="160" y="432" text-anchor="middle" font-family="Inter" font-size="13" font-weight="700" fill="#ffffff">✓ pass</text>
  </svg>
</div>
</body>
</html>
