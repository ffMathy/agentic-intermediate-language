<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIL: follow one sentence from idea to working software</title>
    <meta name="description" content="AIL is a spec language for building software with AI agents. Follow one real sentence from a product promise down to the code, the check that proves it, and the game you can play." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      html { scroll-behavior: smooth; }
      body { margin: 0; font-family: var(--font-sans); background: var(--color-page); color: var(--color-text); -webkit-font-smoothing: antialiased; }
      *, *::before, *::after { box-sizing: border-box; }
      :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

      @keyframes ail-dash { to { stroke-dashoffset: -20; } }

        html { scroll-behavior: auto; }
        *, *::before, *::after { animation: none !important; transition: none !important; }
